name: Deploy K and P Traders

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ https://iucmkvbmsixagvslticf.supabase.co }}
      VITE_SUPABASE_ANON_KEY: ${{ sb_publishable_yyx6pFFYiusWXBRWtc1gkQ_Uu28gbFs }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Diagnose Supabase configuration
        env:
          URL_EXISTS: ${{ contains(toJSON(secrets), 'VITE_SUPABASE_URL') }}
          KEY_EXISTS: ${{ contains(toJSON(secrets), 'VITE_SUPABASE_ANON_KEY') }}
        shell: bash
        run: |
          echo "URL secret name found: $URL_EXISTS"
          echo "KEY secret name found: $KEY_EXISTS"

          if [ -n "$VITE_SUPABASE_URL" ]; then
            echo "URL value available: YES"
          else
            echo "::error::URL value available: NO"
          fi

          if [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "KEY value available: YES"
          else
            echo "::error::KEY value available: NO"
          fi

          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Supabase configuration is missing"
            exit 1
          fi

          echo "SUCCESS: Both Supabase values are available"

      - name: Build React website
        run: npm run build

      - name: Verify build output
        shell: bash
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::Production build is missing"
            exit 1
          fi

          echo "SUCCESS: Production build exists"

      - name: Create SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy Website
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4